name: ACNH Platform compatibility candidate (no release)
on:
  push:
    branches: [compat/platform-v2.6-acnh-recovery]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  legacy:
    if: github.event_name == 'push' || github.head_ref == 'compat/platform-v2.6-acnh-recovery'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test Tests/SysBot.ACNHOrders.Tests/SysBot.ACNHOrders.Tests.csproj -c Release --logger "console;verbosity=normal"
      - run: dotnet publish SysBot.ACNHOrders.csproj -c Release -f net10.0 -o candidate
      - uses: actions/upload-artifact@v4
        with:
          name: acnh-legacy-candidate-${{ matrix.os }}
          path: candidate/
          retention-days: 7
  platform:
    if: github.event_name == 'push' || github.head_ref == 'compat/platform-v2.6-acnh-recovery'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: 969981/SysBot.Platform
          ref: 4748b461bc7aabc7a279f52dea32cbd053cea381
          path: platform-source
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build pinned Platform SDK, then compile original bot against its DLL
        shell: bash
        run: |
          set -euo pipefail
          dotnet build platform-source/src/SysBot.ACNH.Adapter/SysBot.ACNH.Adapter.csproj -c Release -o "$RUNNER_TEMP/platform-sdk"
          cp "$RUNNER_TEMP/platform-sdk/SysBot.Base.dll" "$RUNNER_TEMP/platform-sdk/SysBot.ACNH.Adapter.dll" "$RUNNER_TEMP/platform-sdk/SysBot.Platform.Imaging.dll" deps/
          rm -rf platform-source
          dotnet test Tests/SysBot.ACNHOrders.Tests/SysBot.ACNHOrders.Tests.csproj -c Release -p:PlatformCandidate=true --logger "console;verbosity=normal"
